[project]
name = "quarto-pptx-styler"
version = "0.1.0"
description = "Build a customized PowerPoint template from Quarto's default and patch rendered decks (fonts, colors, geometry, math images, text autofit)."
requires-python = ">=3.10"
dependencies = [
    "cssselect>=1.5.0",
    "python-pptx>=1.0.0",
    "PyYAML>=6.0",
    "tinycss2>=1.5.1",
]

[tool.uv]
package = false
